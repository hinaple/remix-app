name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a versioned release commit
        run: node scripts/release/publish.mjs --check

      - name: Publish packages and create releases
        id: changesets
        uses: changesets/action@v1
        with:
          publish: node scripts/release/publish.mjs
        env:
          HOME: ${{ runner.temp }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload verified Host APK
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: remixApp-host-debug-apk
          path: packages/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
