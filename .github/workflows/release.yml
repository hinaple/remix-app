name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a versioned release commit
        run: node scripts/release/publish.mjs --check

      - name: Publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: node scripts/release/publish.mjs
          createGithubReleases: false
        env:
          HOME: ${{ runner.temp }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Restore Android signing key
        if: steps.changesets.outputs.published == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\remixapp-release.jks",
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

      - name: Build production Host APK
        if: steps.changesets.outputs.published == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}\remixapp-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd packages/app/android
          .\gradlew.bat assembleRelease

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"

          $apk = "packages/app/android/app/build/outputs/apk/release/app-release.apk"
          $releaseApk = "$env:RUNNER_TEMP\remixapp-host-$version.apk"

          Copy-Item $apk $releaseApk

          gh release create "v$version" `
            $releaseApk `
            --title "remixApp $version" `
            --generate-notes `
            --target "${{ github.sha }}"
